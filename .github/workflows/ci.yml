name: CI

on:
  pull_request:
  push:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install kym-tco
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run self-contained product tests
        run: |
          KYM_TCO_SKILL_ROOT="$GITHUB_WORKSPACE/.codex/skills" PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify generated KB is current
        run: |
          python kb/tools/render_kb.py --check
