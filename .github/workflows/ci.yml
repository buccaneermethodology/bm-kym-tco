name: CI

on:
  pull_request:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Compile distributed Python sources
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-pycache" python -m compileall -q src tools .codex/skills
      - name: Verify installed CLIs, schemas, and bundled Skills
        run: python tools/ci_smoke.py
