[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-kym-tco"
version = "0.4.9"
description = "Deterministic KYM revision, approval, TCO coverage, and verification tooling"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["PyYAML>=6.0"]

[project.scripts]
kym = "kym_tco.kym_cli:main"
tco = "kym_tco.tco_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kym_tco = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/bm-kym-tco/codex/skills/build-kym" = [
  ".codex/skills/build-kym/SKILL.md",
  ".codex/skills/build-kym/distribution.json",
]
