[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-kym-tco"
version = "0.4.4"
description = "Deterministic KYM revision, approval, TCO coverage, and verification tooling"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["jsonschema>=4.18"]

[project.scripts]
kym = "kym_tco.kym_cli:main"
tco = "kym_tco.tco_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kym_tco = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/bm-kym-tco/codex/skills/build-kym" = [
  ".codex/skills/build-kym/SKILL.md",
  ".codex/skills/build-kym/distribution.json",
]
"share/bm-kym-tco/codex/skills/build-kym/agents" = [
  ".codex/skills/build-kym/agents/openai.yaml",
]
"share/bm-kym-tco/codex/skills/build-kym/references" = [
  ".codex/skills/build-kym/references/doctor-cli-missing-report.json",
  ".codex/skills/build-kym/references/kym-analysis-guide.md",
  ".codex/skills/build-kym/references/kym-contract.md",
  ".codex/skills/build-kym/references/kym-reader-quality.md",
  ".codex/skills/build-kym/references/kym-semantic-placement.md",
  ".codex/skills/build-kym/references/portable-governance.yaml",
]
"share/bm-kym-tco/codex/skills/build-kym/scripts" = [
  ".codex/skills/build-kym/scripts/audit_candidate.py",
]
"share/bm-kym-tco/codex/skills/build-tco-coverage" = [
  ".codex/skills/build-tco-coverage/SKILL.md",
  ".codex/skills/build-tco-coverage/distribution.json",
]
"share/bm-kym-tco/codex/skills/build-tco-coverage/agents" = [
  ".codex/skills/build-tco-coverage/agents/openai.yaml",
]
"share/bm-kym-tco/codex/skills/build-tco-coverage/references" = [
  ".codex/skills/build-tco-coverage/references/doctor-cli-missing-report.json",
  ".codex/skills/build-tco-coverage/references/portable-governance.yaml",
  ".codex/skills/build-tco-coverage/references/tco-contract.md",
  ".codex/skills/build-tco-coverage/references/tco-modeling-guide.md",
]
"share/bm-kym-tco/codex/skills/build-tco-coverage/scripts" = [
  ".codex/skills/build-tco-coverage/scripts/audit_candidate.py",
  ".codex/skills/build-tco-coverage/scripts/audit_reader_language.py",
]
